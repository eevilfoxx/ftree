name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: ${{ matrix.shell }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shell: [bash, cmd]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libsfml-dev

      if: matrix.os == 'windows-latest'
        uses: actions/setup-msbuild@v1

      - name: Install vcpkg
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg.git %APPDATA%\vcpkg
          %APPDATA%\vcpkg\bootstrap/bootstrap.vx64.exe

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libsfml-dev

      if: matrix.os == 'windows-latest'
        run: |
          set VCPKG_ROOT=%APPDATA%\vcpkg
          %APPDATA%\vcpkg\bootstrap.exe
          vcpkg install sfml:x64-windows

      - name: Configure CMake
        working-directory: ./build
        run: cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build application
        working-directory: ./build
        run: cmake --build . --config Release --parallel

      - name: Run tests
        working-directory: ./build
        run: |
          ctest --test-dir . -C Release --output-on-failure
          if [ $? -ne 0 ]; then
            echo "::error Tests failed ::"
            exit 1
          fi

      - name: Create archive name
        working-directory: ./build
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "ARCHIVE_NAME=ftree-linux-x64.tar.gz" >> $GITHUB_ENV
          shell: bash
        if: matrix.os == 'windows-latest'
        run: |
          echo "ARCHIVE_NAME=ftree-windows-x64.zip" >> $GITHUB_ENV
          shell: bash

      - name: Package artifacts
        working-directory: ./build
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            mkdir -p /tmp/release-artifacts
            # Copy the built application (FamilyTreeTests is the test binary, look for the actual app)
            # Since the project builds FamilyTreeTests as the test target, we need to find the actual executable
            # For this project, FamilyTreeTests IS the test binary, so we'll copy it and mark it appropriately
            cp FamilyTreeTests /tmp/release-artifacts/family-tree-tests
            cp -R ../config /tmp/release-artifacts/
            cp -R ../assets /tmp/release-artifacts/
            echo "Assets and binary packed for Linux"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p /tmp/release-artifacts
            # The built executable is FamilyTreeTests.exe
            copy .\FamilyTreeTests.exe /tmp/release-artifacts\family-tree-tests.exe
            copy config\\* /tmp/release-artifacts\
            copy assets\\* /tmp/release-artifacts\
            echo "Assets and binary packed for Windows"

      - name: Upload release artifacts
        if: success()
        working-directory: /tmp/release-artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: /tmp/release-artifacts/*

      - name: Create GitHub Release
        if: success()
        working-directory: ./
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            ${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: false
