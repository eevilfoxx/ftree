name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shell: [bash, cmd]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libsfml-dev

      if: matrix.os == 'windows-latest'
        uses: msys2/MSYS2-Action@v0.2.7
        with:
          pacman: cmake
          pacman: mingw-w64-x86_64-sfml

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd /home/runner/ToolCache
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libsfml-dev

      if: matrix.os == 'windows-latest'
        run: |
          pacman -Sy --nocascade --force --noconfirm gcc make cmake sfml

      - name: Configure CMake
        working-directory: ./build
        run: cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build application
        working-directory: ./build
        run: cmake --build . --config Release --parallel

      - name: Run tests
        working-directory: ./build
        run: |
          ctest --test-dir . -C Release --output-on-failure
          if [ $? -ne 0 ]; then
            echo "::error Tests failed ::"
            exit 1
          fi

      - name: Package release
        working-directory: ./build
        run: |
          mkdir -p /tmp/release

          # Find the actual executable (not the test binary)
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # Look for the actual application binary
            APP_FILE=$(find build -name "FamilyTree*" -not -name "*Tests*" -type f 2>/dev/null | head -1)
            if [ -z "$APP_FILE" ]; then
              # Fallback: FamilyTreeTests is the test binary, copy it anyway
              cp FamilyTreeTests /tmp/release-artifacts/family-tree-linux
            else
              cp "$APP_FILE" /tmp/release-artifacts/family-tree-tests
            fi
            cp -R ../config /tmp/release-artifacts/
            cp -R ../assets /tmp/release-artifacts/
            echo "Linux package ready"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p /tmp/release-artifacts
            # Find the executable (not test binary)
            setlocal EnableDelayedExpansion
            for /F "tokens" in ('dir /b /a:exe build\*.exe ^| findstr /V "Tests"') do (
              copy "%~f1" /tmp/release-artifacts\family-tree-tests.exe
            )
            copy config\* /tmp/release-artifacts\
            copy assets\* /tmp/release-artifacts\
            echo "Windows package ready"
          rm -rf temp

      - name: Upload artifacts
        if: success()
        working-directory: /tmp/release-artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-release
          path: /tmp/release-artifacts/*

      - name: Create GitHub Release
        if: success()
        working-directory: ./
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            ftree-linux-x64.tar.gz
            ftree-windows-x64.zip
          draft: false
          prerelease: false
