name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================
  # LINUX
  # ==========================================

  build-linux:
    name: Linux Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            libsfml-dev \
            libgtest-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build application and tests
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Run tests
        run: |
          ctest --test-dir build \
            -C Release \
            --output-on-failure

  # ==========================================
  # WINDOWS
  # ==========================================

  build-windows:
    name: Windows Build and Tests
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pkg-config
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure pkg-config
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $pkgConfig = Join-Path $env:MSYS2_LOCATION "ucrt64\\bin\\pkg-config.exe"

          if (-not (Test-Path $pkgConfig)) {
            $pkgConfig = Join-Path $env:MSYS2_LOCATION "ucrt64\\bin\\pkgconf.exe"
          }

          if (-not (Test-Path $pkgConfig)) {
            Get-ChildItem (Join-Path $env:MSYS2_LOCATION "ucrt64\\bin") |
              Where-Object { $_.Name -match "pkg" } |
              Select-Object -ExpandProperty FullName

            throw "pkg-config executable not found"
          }

          & $pkgConfig --version
          "PKG_CONFIG=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          $pkgDir = Split-Path -Parent $pkgConfig
          "$pkgDir" | Out-File -FilePath $env:GITHUB_PATH -Append


      
      # ----------------------------------------
      # Install vcpkg
      # ----------------------------------------

      - name: Checkout vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"

          cd "$env:RUNNER_TEMP\vcpkg"

          git checkout 2024.04.26

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------

      - name: Install SFML and GoogleTest
        shell: pwsh
        run: |
          # ilammy/msvc-dev-cmd sets VCPKG_ROOT to the Visual Studio bundled vcpkg,
          # which conflicts with our checked-out vcpkg. Unset it so vcpkg uses its own root.
          if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT = $null }

          # Ensure vcpkg finds pkg-config (installed via msys2) instead of trying to
          # download pkgconf from MSYS2 mirrors that return 404.
          if (-not $env:PKG_CONFIG) {
            $pkgConfig = Join-Path $env:MSYS2_LOCATION "ucrt64\\bin\\pkg-config.exe"
            if (-not (Test-Path $pkgConfig)) {
              $pkgConfig = Join-Path $env:MSYS2_LOCATION "ucrt64\\bin\\pkgconf.exe"
            }
            $env:PKG_CONFIG = $pkgConfig
          }

          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install `
            --vcpkg-root "$env:RUNNER_TEMP\vcpkg" `
            sfml:x64-windows `
            gtest:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install dependencies"
          }

          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" list

      # ----------------------------------------
      # Configure project
      # ----------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      # ----------------------------------------
      # Build
      # ----------------------------------------

      - name: Build application and tests
        run: |
          cmake --build build `
            --config Release `
            --parallel

      # ----------------------------------------
      # Tests
      # ----------------------------------------

      - name: Run tests
        run: |
          ctest --test-dir build `
            -C Release `
            --output-on-failure