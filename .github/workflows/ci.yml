name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux Build + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsfml-dev \
            libgtest-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify application executable
        shell: bash
        run: |
          APP="$(find build -type f -name 'FamilyTree' ! -name '*Tests*' -print -quit)"

          if [ -z "$APP" ]; then
            echo "::error::Application executable was not built"
            find build -type f -executable
            exit 1
          fi

          echo "Application built: $APP"

  build-windows:
    name: Windows Build + Tests
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sfml
            mingw-w64-x86_64-gtest

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify application executable
        run: |
          APP="$(find build -type f -iname 'FamilyTree.exe' ! -iname '*Tests*' -print -quit)"

          if [ -z "$APP" ]; then
            echo "::error::Application executable was not built"
            find build -type f -iname '*.exe'
            exit 1
          fi

          echo "Application built: $APP"