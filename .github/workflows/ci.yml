name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux Build + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          sudo apt-get install -y libsfml-dev libgtest-dev

      - name: Configure CMake
        working-directory: ./build
        run: cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build application and tests
        working-directory: ./build
        run: cmake --build . --config Release --parallel

      - name: Run tests
        working-directory: ./build
        run: ctest --test-dir . -C Release --output-on-failure

      - name: Verify application was built
        working-directory: ./build
        run: |
          if [ ! -f ./FamilyTreeTests ]; then
            echo "ERROR: Test binary not built"
            exit 1
          fi
          echo "Test binary built successfully"

  build-windows:
    name: Windows Build + Tests
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install vcpkg
        uses: microsoft/setup-vcpkg@v1

      - name: Install dependencies with vcpkg
        run: |
          vcpkg install sfml:x64-windows
          vcpkg install gtest:x64-windows

      - name: Configure CMake (Windows)
        working-directory: ./build
        run: cmake -S .. -B . -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build application and tests
        working-directory: ./build
        run: cmake --build . --config Release --parallel

      - name: Run tests
        working-directory: ./build
        run: ctest --test-dir . -C Release --output-on-failure
