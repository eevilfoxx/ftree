
name: CI

# Запускать CI на любой ветке, кроме веток для документации и gh-pages
on:
  push:
    branches-ignore:
      - 'docs/**'
      - 'gh-pages'
      - 'dependabot/**'

  pull_request:
    branches-ignore:
      - 'docs/**'
      - 'gh-pages'
      - 'dependabot/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsfml-dev \
            libgtest-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build application and tests
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Run tests
        run: |
          ctest --test-dir build \
            -C Release \
            --output-on-failure

  build-windows:
    name: Windows Build and Tests
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2 pkg-config
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Checkout vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"

          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          git -C $vcpkgRoot checkout 2024.04.26
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout pinned vcpkg baseline"
          }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"

          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg"
          }

      # Кэш готовых бинарных пакетов vcpkg.
      # При повторных запусках зависимости не потребуется собирать заново,
      # если их ABI и параметры сборки не изменились.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: windows-vcpkg-2024.04.26-x64-windows
          restore-keys: |
            windows-vcpkg-2024.04.26-x64-windows

      - name: Install SFML and GoogleTest
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $msysBin = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"

          # vcpkg's PKGCONFIG acquisition helper checks ENV{PKG_CONFIG}.
          $pkgConfig = Join-Path $msysBin "pkg-config.exe"
          if (-not (Test-Path $pkgConfig)) {
            $pkgConfig = Join-Path $msysBin "pkgconf.exe"
          }

          if (-not (Test-Path $pkgConfig)) {
            Get-ChildItem $msysBin -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "pkg-config/pkgconf executable not found in $msysBin"
          }

          & $pkgConfig --version
          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config is not executable"
          }

          $env:PKG_CONFIG = $pkgConfig

          # CMake 4 compatibility for legacy dependencies.
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          # Preserve required environment variables in vcpkg port builds.
          $env:VCPKG_KEEP_ENV_VARS = "PKG_CONFIG;CMAKE_POLICY_VERSION_MINIMUM"

          $env:PATH = "$msysBin;$env:PATH"

          # Use the explicitly checked-out vcpkg instance.
          $env:VCPKG_ROOT = $vcpkgRoot

          # Enable local binary cache.
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:RUNNER_TEMP/vcpkg-binary-cache,readwrite"

          & (Join-Path $vcpkgRoot "vcpkg.exe") install `
            --vcpkg-root $vcpkgRoot `
            sfml:x64-windows `
            gtest:x64-windows

          if ($LASTEXITCODE -ne 0) {
            $logDir = Join-Path $vcpkgRoot "buildtrees\bzip2"

            Write-Host "===== BZIP2 CONFIGURE OUTPUT ====="
            Get-Content (Join-Path $logDir "config-x64-windows-out.log") `
              -Tail 200 -ErrorAction SilentlyContinue

            Write-Host "===== BZIP2 RELEASE CONFIGURE LOG ====="
            Get-Content (Join-Path $logDir "config-x64-windows-rel-CMakeCache.txt.log") `
              -Tail 200 -ErrorAction SilentlyContinue

            Write-Host "===== BZIP2 DEBUG CONFIGURE LOG ====="
            Get-Content (Join-Path $logDir "config-x64-windows-dbg-CMakeCache.txt.log") `
              -Tail 200 -ErrorAction SilentlyContinue

            throw "Failed to install vcpkg dependencies"
          }

          & (Join-Path $vcpkgRoot "vcpkg.exe") list

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"

          cmake -S . -B build `
            -A x64 `
            -DBUILD_TESTING=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build application
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target FamilyTree `
            --parallel 1 `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            throw "FamilyTree build failed with exit code $LASTEXITCODE"
          }

      - name: Build tests
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target FamilyTreeTests `
            --parallel 1 `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            throw "FamilyTreeTests build failed with exit code $LASTEXITCODE"
          }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir build `
            -C Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed with exit code $LASTEXITCODE"
          }
